<h1>Pancakes</h1>

<p>A quick and easy pancake recipe.</p>

<h2>Ingredients</h2>
<ul>
  <li>1 cup flour</li>
  <li>1 cup milk</li>
  <li>1 egg</li>
</ul>

<h2>Steps</h2>
<ol>
  <li>Mix the flour, milk, and egg in a bowl.</li>
  <li>Pour some batter into a hot pan.</li>
  <li>Cook until golden on both sides.</li>
  <li>Serve and enjoy.</li>
</ol>
