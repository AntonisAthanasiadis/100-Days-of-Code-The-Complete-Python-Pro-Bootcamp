<!DOCTYPE html>
<html>
<head>
    <title>Jinja Example</title>
</head>
<body>

    <h1>Hello {{ name }}</h1>

    {% if logged_in %}
        <p>You are logged in.</p>
    {% else %}
        <p>Please log in.</p>
    {% endif %}

    <h2>Skills</h2>

    <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>

</body>
</html>
