<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e8f4ff;
        }

        .card {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        h2 {
            color: #0078d4;
        }

        p {
            color: #444;
        }

        .button {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>My Profile</h2>

        <p>
            Hello, my name is Tony. I am a Computer Engineer.
        </p>
        <!-- That email is fake of course, don't try to contact me here. -->
        <a class="button"
           href="mailto:john.doe@example.com?subject=Contact%20Request&body=Hello%20John,">
            Send Email
        </a>
    </div>

</body>
</html>
